  /scotland/assessments/search:
    get:
      tags:
        - Scotland Frontend
      summary: Search for Scottish assessments
      description: |-
        Search for an Scottish assessment by
          _either_:
           - a postcode AND assessment type; _or_
           - a street AND town AND assessment type; _or_
           - an assessment reference number (RRN)
      operationId: scotland-search-assessments
      security:
        - oauth:
            - 'scotland_assessment:search'
      parameters:
        - in: query
          name: postcode
          description: The postcode of the address being searched for
          schema:
            $ref: '#/components/schemas/AddressPostcode'
          examples:
            fl23:
              value: 'FL23 4JA'
              summary: A sample postcode
        - in: query
          name: assessmentTypes
          description: The types of assessment being searched for, separated by commas
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AssessmentType'
          explode: false
          examples:
            domestic:
              value: ['RdSAP','SAP']
              summary: Domestic EPCs
            nonDomestic:
              value: ['CEPC','AC-CERT','DEC']
              summary: Non-domestic certificates
        - in: query
          name: street
          description: The street of the assessment being searched for
          schema:
            type: string
          examples:
            highRoad:
              value: 'High road'
              summary: A sample street name
        - in: query
          name: town
          description: The city or town of the assessment being searched for
          schema:
            $ref: '#/components/schemas/AddressTown'
          examples:
            woking:
              value: 'Woking'
              summary: A sample town
        - in: query
          name: assessmentId
          description: The RRN of the assessment being searched for
          schema:
            $ref: '#/components/schemas/AssessmentId'
          examples:
            rrnEg:
              value: '1234-2345-3456-4567-6789'
              summary: A sample RRN
      responses:
        '200':
          description: Assessment search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      assessments:
                        type: array
                        items:
                          $ref: '#/components/schemas/ScottishDomesticEPCsSearchResult'
        '400':
          description: Bad request - missing or malformed parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

