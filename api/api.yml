openapi: 3.1.0

info:
  title: Energy Performance of Buildings Register API
  description: Public API for EPBR integrations
  contact:
    name: MHCLG Digital helpdesk (prefix email subject with "EPB")
    email: mhclg.digital-services@communities.gov.uk
  version: 1.2.2

servers:
  - url: 'https://api.epb-integration.digital.communities.gov.uk/api'
    description: Integration Service
  - url: 'https://api.epb-staging.digital.communities.gov.uk/api'
    description: Staging Service
  - url: 'https://api.epb.digital.communities.gov.uk/api'
    description: Production Service

tags:
  - name: Search
    description: Search the register given filtering data
  - name: Manage Assessors
    description: Manage assessors for a given Scheme
  - name: Manage Assessments
    description: Manage EPCs, DECs, RRs and AC-REPORTs
  - name: Manage Schemes
    description: Operations for managing schemes in the register
  - name: Green Deal
    description: Endpoints used by the Green Deal register integration, including Renewable Heat Initiative
  - name: Boiler Upgrade Scheme
    description: Endpoints used by the Boiler Upgrade Scheme
  - name: Great British Insulation Scheme
    description: Endpoints used by the Great British Insulation Scheme Scheme (previously known as the Energy Company Obligation (ECO) Scheme)
  - name: Find Ways to Save Energy
    description: Endpoints used by the Find Ways to Save Energy service (previously known as the Home Energy Retrofit Advice service)
  - name: Home Energy Retrofit Funding
    description: Endpoints used by the Home Energy Retrofit Funding service
  - name: Heat Pump Check
    description: Endpoints used by the Heat Pump Check service
  - name: Warm Home Discount
    description: Endpoints used by the Warm Home Discount service
  - name: PRS Database
    description: Endpoints used by the PRS landlord database services
  - name: Reports
    description: Endpoints providing reports, i.e. specific data views of operational interest
  - name: Service Performance
    description: Endpoints used in providing the Service Performance page
  - name: Scotland Frontend
    description: Endpoints used by the Scotland frontend services
  - name: Scotland Data
    description: Endpoints used by the Scotland data services

paths:
  /schemes:
    get:
      tags:
        - Manage Schemes
      summary: List the energy assessment schemes
      description: Get a list of all energy assessment schemes in the register
      operationId: list-schemes
      security:
        - oauth:
            - 'scheme:list'
      parameters: []
      responses:
        '200':
          description: List of all schemes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      schemes:
                        type: array
                        items:
                          $ref: '#/components/schemas/Scheme'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Manage Schemes
      summary: Add an energy assessment scheme
      description: Add a new energy assessment scheme to the register
      operationId: add-scheme
      security:
        - oauth:
            - 'scheme:create'
      requestBody:
        description: The scheme to be added
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemeBody'
      responses:
        '201':
          description: Scheme successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Scheme'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Scheme already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          examples:
                            - SCHEME_ALREADY_EXISTS
                        title:
                          type: string
                          examples:
                            - A scheme with this name already exists in the register
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /schemes/{schemeId}:
    put:
      tags:
        - Manage Schemes
      summary: Update a scheme
      description: Update the details of an energy assessment scheme
      operationId: update-scheme
      responses:
        '204':
          description: Update successful
        '404':
          description: Scheme not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - in: path
          name: schemeId
          required: true
          description: The ID of the scheme being updated
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemeBody'

  /schemes/{schemeId}/assessors:
    get:
      tags:
        - Manage Assessors
      summary: List assessors for a scheme
      description: List a summary of assessors belonging to a scheme
      operationId: list-scheme-assessors
      security:
        - oauth:
            - 'scheme:assessor:list'
      parameters:
        - in: path
          name: schemeId
          required: true
          description: ID of the scheme
          schema:
            type: integer
      responses:
        '200':
          description: List of assessors for a scheme
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      assessors:
                        type: array
                        items:
                          $ref: '#/components/schemas/AssessorBody'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Scheme not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /schemes/{schemeId}/assessors/{schemeAssessorId}:
    get:
      tags:
        - Manage Assessors
      summary: Get details for an assessor on a scheme
      description: Get all details for an individual assessor registration
      operationId: get-scheme-assessor
      security:
        - oauth:
            - 'scheme:assessor:fetch'
      parameters:
        - in: path
          name: schemeId
          required: true
          description: ID of the registering scheme
          schema:
            type: integer
        - in: path
          name: schemeAssessorId
          required: true
          description: The Assessor ID assigned by the registering scheme
          schema:
            $ref: '#/components/schemas/AssessorSchemeId'
      responses:
        '200':
          description: Assessor found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AssessorBody'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Assessor not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Manage Assessors
      summary: Update or add an assessor
      description: >-
        Register a new assessor to associate them with your scheme,
        or update details of an assessor already on your scheme.
      operationId: upsert-assessor
      security:
        - oauth:
            - 'scheme:assessor:update'
      parameters:
        - in: path
          name: schemeId
          required: true
          description: ID of the registering scheme
          schema:
            type: integer
        - in: path
          name: schemeAssessorId
          required: true
          description: The Assessor ID assigned by the registering scheme
          schema:
            $ref: '#/components/schemas/AssessorSchemeId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessorBody'
      responses:
        '200':
          description: Existing assessor updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AssessorBody'
        '201':
          description: New assessor successfully registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AssessorBody'
        '400':
          description: Problem with assessor registration record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Assessor already exists on a different scheme
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Assessor data is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /assessors:
    get:
      tags:
        - Search
        - Manage Assessors
      summary: Search for an assessor
      description: |-
        Search for an assessor by postcode or full name/number.

        Clients with scope `assessor:search` can search by
          _either_:
          - a postcode (with scope `assessor:search`) and comma-separated list of qualifications; _or_
          - full name (with scope `assessor:search`) and optional qualification type (domestic or non-domestic)

        Clients with scope `scheme:assessor:fetch` can search by
          - firstName AND lastName AND dateOfBirth
      operationId: search-assessors
      security:
        - oauth:
            - 'assessor:search'
            - 'scheme:assessor:fetch'
      parameters:
        - in: query
          name: postcode
          description: A postcode to search from for an assessor
          schema:
            $ref: '#/components/schemas/AddressPostcode'
        - in: query
          name: name
          description: The name of the assessor
          schema:
            $ref: '#/components/schemas/AssessorFullName'
        - in: query
          name: qualification
          description: Only show assessors who have this specific qualification
          schema:
            $ref: '#/components/schemas/AssessorQualificationSearchOptions'
        - in: query
          name: qualificationType
          description: Only show assessors who have this type of qualification
          schema:
            $ref: '#/components/schemas/AssessorQualificationTypeSearchOptions'
        - in: query
          name: firstName
          description: The first name of the assessor
          schema:
            $ref: '#/components/schemas/FirstName'
        - in: query
          name: lastName
          description: The last name of the assessor
          schema:
            $ref: '#/components/schemas/LastName'
        - in: query
          name: dateOfBirth
          description: The date of birth of the assessor
          schema:
            $ref: '#/components/schemas/DateOfBirth'
      responses:
        '200':
          description: List of assessors matching the search criteria
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AssessorSearchResults'
                  - $ref: '#/components/schemas/AssessorSearchByPostcodeResults'
                  - $ref: '#/components/schemas/AssessorBody'
        '400':
          description: Invalid query - probably a missing parameter or disallowed combination of parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /search/addresses:
    get:
      tags:
        - Search
      summary: Search for usable addresses for an assessment
      description: |-
        Search for an address by (optional) type and
          _either_:
          - a postcode (with optional building name or number); _or_
          - a street AND town; _or_
          - a building reference number (UPRN or RRN)
      operationId: search-addresses
      security:
        - oauth:
            - 'address:search'
      parameters:
        - in: query
          name: postcode
          description: The postcode of the address being searched for
          schema:
            $ref: '#/components/schemas/AddressPostcode'
        - in: query
          name: buildingNameNumber
          description: The building name or number being searched for
          schema:
            type: string
          examples:
            fortySeven:
              value: '47'
              summary: A sample building number
        - in: query
          name: street
          description: The street of the address being searched for
          schema:
            type: string
          examples:
            highRoad:
              value: 'High road'
              summary: A sample street name
        - in: query
          name: town
          description: The city or town of the address being searched for
          schema:
            $ref: '#/components/schemas/AddressTown'
          examples:
            woking:
              value: 'Woking'
              summary: A sample town
        - in: query
          name: addressId
          description: A known UPRN or RRN to fetch a single address
          schema:
            type: string
          examples:
            uprnEg:
              value: 'UPRN-716375734512'
              summary: A sample UPRN
        - in: query
          name: addressType
          description: Domestic or commercial address
          schema:
            type: string
            enum:
              - DOMESTIC
              - COMMERCIAL
      responses:
        '200':
          description: Address search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressSearchResults'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /assessments/search:
    get:
      tags:
        - Search
        - Manage Assessments
      summary: Search for assessments
      description: |-
        Search for an assessment by
          _either_:
           - a postcode AND assessment type; _or_
           - a street AND town AND assessment type; _or_
           - an assessment reference number (RRN)
      operationId: search-assessments
      security:
        - oauth:
            - 'assessment:search'
      parameters:
        - in: query
          name: postcode
          description: The postcode of the address being searched for
          schema:
            $ref: '#/components/schemas/AddressPostcode'
          examples:
            fl23:
              value: 'FL23 4JA'
              summary: A sample postcode
        - in: query
          name: assessmentTypes
          description: The types of assessment being searched for, separated by commas
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AssessmentType'
          explode: false
          examples:
            domestic:
              value: ['RdSAP','SAP']
              summary: Domestic EPCs
            nonDomestic:
              value: ['CEPC','AC-CERT','DEC']
              summary: Non-domestic certificates
        - in: query
          name: street
          description: The street of the assessment being searched for
          schema:
            type: string
          examples:
            highRoad:
              value: 'High road'
              summary: A sample street name
        - in: query
          name: town
          description: The city or town of the assessment being searched for
          schema:
            $ref: '#/components/schemas/AddressTown'
          examples:
            woking:
              value: 'Woking'
              summary: A sample town
        - in: query
          name: assessmentId
          description: The RRN of the assessment being searched for
          schema:
            $ref: '#/components/schemas/AssessmentId'
          examples:
            rrnEg:
              value: '1234-2345-3456-4567-6789'
              summary: A sample RRN
      responses:
        '200':
          description: Assessment search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      assessments:
                        type: array
                        items:
                          $ref: '#/components/schemas/EnergyAssessmentSearchResult'
        '400':
          description: Bad request - missing or malformed parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /assessments/domestic-epcs/search:
    get:
      tags:
        - Search
        - Great British Insulation Scheme
        - Find Ways to Save Energy
        - Heat Pump Check
        - Warm Home Discount
      summary: Search for domestic EPCs by address
      description: 'Search for an assessment by postcode and optional building
                    name/number. If building name/number is not supplied then
                    all domestic EPC matches for the postcode are returned.'
      operationId: search-domestic-epcs
      security:
        - oauth:
            - 'assessment:domestic-epc:search'
      parameters:
        - in: query
          name: postcode
          description: The postcode of the address being searched for
          required: true
          schema:
            $ref: '#/components/schemas/AddressPostcode'
          examples:
            fl23:
              value: 'FL23 4JA'
              summary: A sample postcode
        - in: query
          name: buildingNameOrNumber
          description: The name or number for the building (optional)
          required: false
          schema:
            $ref: '#/components/schemas/AddressBuildingNameOrNumber'
          examples:
            fortySeven:
              value: '47'
              summary: A sample building number
      responses:
        '200':
          description: Domestic EPC search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      assessments:
                        type: array
                        items:
                          $ref: '#/components/schemas/DomesticEPCsSearchResult'
                examples:
                  - type: object
                    properties:
                      - epcRrn: "1111-1111-1111-1111-1111"
                        address:
                          addressLine1: "11 Acacia Avenue"
                          addressLine2: "Upper Wellgood"
                          addressLine3: ""
                          addressLine4: ""
                          town: "Fulchester"
                          postcode: "FL23 4JA"
                      - epcRrn: "2222-2222-2222-2222-2222"
                        address:
                          addressLine1: "22 Acacia Avenue"
                          addressLine2: "Upper Wellgood"
                          addressLine3: ""
                          addressLine4: ""
                          town: "Fulchester"
                          postcode: "FL23 4JA"
        '400':
          description: 'Bad request - most likely an invalid postcode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No matching EPCs found for the given query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /assessments:
    post:
      tags:
        - Manage Assessments
      summary: Lodge a new assessment or migrate an existing assessment
      description: |-
        Single endpoint for POSTing all new lodgements.

        It will accept as an XML payload one of the following:
        * A single <Report> for a domestic RdSAP assessment
        * A single <Report> for a domestic SAP assessment
        * Non-domestic EPC and Recommendation report in a single XML
          payload with two <Report> elements
        * Air Conditioning certificate and AC-report in a single XML
          payload with two <Report> elements
        * A single <Report> for DEC
        * A single <Report> for DEC recommendation report
        * DEC and DEC-RR in a single XML payload with two <Report>
          elements
      operationId: lodge-assessment
      security:
        - oauth:
            - 'assessment:lodge'
            - 'migrate:assessment'
      parameters:
        - in: query
          name: override
          description: 'Only set to true after assessor has manually confirmed
                        desire to override lodgement rules. This action will be
                        logged.'
          schema:
            type: boolean
          examples:
            yes:
              value: true
              summary: Value to add to override lodgement rules
        - in: query
          name: migrated
          description: 'For use by EPB register only. Set to true if migrating a
                        previous lodgement.
                        Requires migrate:assessment scope in client credentials.'
          schema:
            type: boolean
          examples:
            yes:
              value: true
              summary:  Value to add for migrated certificates
      requestBody:
        content:
          application/xml+RdSAP-Schema-21.0.1:
            schema:
              $ref: '#/components/schemas/Empty'
          application/xml+RdSAP-Schema-21.0.0:
            schema:
              $ref: '#/components/schemas/Empty'
          application/xml+RdSAP-Schema-20.0.0:
            schema:
              $ref: '#/components/schemas/Empty'
          application/xml+SAP-Schema-18.0.0:
            schema:
              $ref: '#/components/schemas/Empty'
          application/xml+RdSAP-Schema-NI-21.0.1:
            schema:
              $ref: '#/components/schemas/Empty'
          application/xml+RdSAP-Schema-NI-21.0.0:
            schema:
              $ref: '#/components/schemas/Empty'
          application/xml+RdSAP-Schema-NI-20.0.0:
            schema:
              $ref: '#/components/schemas/Empty'
          application/xml+SAP-Schema-NI-18.0.0:
            schema:
              $ref: '#/components/schemas/Empty'
          application/xml+CEPC-8.0.0:
            schema:
              $ref: '#/components/schemas/Empty'
          application/xml+CEPC-NI-8.0.0:
            schema:
              $ref: '#/components/schemas/Empty'
      responses:
        '201':
          description: New assessment(s) successfully lodged
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      assessments:
                        type: array
                        items:
                          type: string
                          properties:
                            assessmentId:
                              $ref: '#/components/schemas/AssessmentId'
                        examples:
                          - ["9876-9876-9876-9876-9876", "8765-8765-8765-8765-8765"]
                  meta:
                    type: object
                    properties:
                      links:
                        type: object
                        properties:
                          assessments:
                            type: array
                            items:
                              type: string
                            examples:
                              - ["/api/assessments/9876-9876-9876-9876-9876", "/api/assessments/8765-8765-8765-8765-8765"]
        '400':
          description: Bad request - assessment violates lodgement rules. Re-POST to the override link to lodge anyway.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          examples:
                            - "FLOOR_AREA_LESS_THAN_ZERO"
                        title:
                          type: string
                          examples:
                            - "Floor-Area must be greater than zero"
                  meta:
                    type: object
                    properties:
                      links:
                        type: object
                        properties:
                          override:
                            type: string
                            examples:
                              - "/assessments?override=true"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Assessment with that assessmentId already exists - retry with different RRN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /assessments/{assessmentId}:
    get:
      tags:
        - Manage Assessments
      summary: Get an assessment's XML
      description: Get an Energy Performance Assessment (XML document)
      operationId: get-assessment-xml
      security:
        - oauth:
            - 'assessment:fetch'
      parameters:
        - in: path
          name: assessmentId
          required: true
          description: 'The ID of the assessment being requested, usually RRN'
          schema:
            $ref: '#/components/schemas/AssessmentId'
      responses:
        '200':
          description: Energy Performance Assessment
          content:
            application/xml:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Empty'
        '400':
          description: Bad request - The assessmentId parameter is badly formatted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Assessment not found
          content:
            application/json:
              schema:
